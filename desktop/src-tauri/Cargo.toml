[package]
name = "brenda-desktop"
version = "0.1.0"
description = "Brenda for Boredroom: the desktop notch"
edition = "2021"

[lib]
name = "brenda_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
tauri-plugin-global-shortcut = "2"
cpal = "0.18"
whisper-rs = "0.16"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# whisper.cpp is far too slow unoptimised; keep it fast in development builds too.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
