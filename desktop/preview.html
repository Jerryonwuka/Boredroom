<!doctype html>
<!-- Layout preview of the notch in an ordinary browser, with sample data. Not part of the app.
     ?state=link|compact|briefing|timer|paused|reminder|report|lead|idle picks the data; ?card=listening|working|thinking|reply|confirm|offer|error|drop|voice-off|typing|speaking
     opens one of Brenda's cards on top of it (?confirm=already answers its Confirm as already done; ?card=listening feeds the
     waveform and her listening face a speech-like microphone level every 70 ms, as Rust does; ?card=working listens for
     two seconds, then writes the words out, to see the bars turn into the travelling wave; ?card=typing types a question
     into the ask box letter by letter, to see her eyes read along). ?typed=some words types into the open card's ask box,
     to see Send turn orange and the card's other orange button (Start, Resume) go white. ?card=reply shows a reply drawn from her
     light Markdown (a lead sentence, bold labels, a bulleted and a numbered list, a link); hovering a button plays its icon's move. The backdrop is a flat grey desktop with a menu bar strip, so
     the black island reads as it does on screen.
     Personal assistants (owner decision, 7 October 2026): ?look=orange,band,round&name=Max draws the person's own assistant
     as any colour, visor and eyes, with its name in the labels (Brenda, white, bean, pill when left out); ?ws=teal,screen,square&wsname=Atlas
     does the same for the workspace's, which the end-of-day report's card shows (?state=report). ?gallery adds a sheet
     under the island with every colour, visor and eyes at both sizes, and every mood and reaction on each visor and eyes,
     for checking that every combination reads.
     Her voice (owner decision, 7 October 2026: phase 2): ?card=speaking opens a reply and feeds `brenda://voice` as Rust
     does while she reads it aloud: `speaking` with a speech-like level every 30 ms for 4 seconds, then `spoken`, so her
     faces talk and the card's Listen button turns to Stop; ?card=speaking&synthetic sends the fallback's start instead
     (`synthetic`, no levels: the page makes the syllables). The mock `speak` and `stop_speaking` commands answer the same
     way after a short pause for rendering, so Listen and Stop work on any reply (&synthetic applies to them too).
     ?speak=always|never sets the person's choice (the default, voice, speaks only answers to the talk keys). ?look=… gives
     the glow her colour.
     Follow-ups between assistants (owner decision, 8 October 2026: phase 4): ?state=ask opens the request card (Olu's Max
     asks about "Landing page"; pick a quick reply, type or say a line, Send or Not now), ?state=ask-ws the workspace's
     collection before the team report, ?state=answer the answer card (Ben's Brenda answered), ?state=no-reply an expired
     one, ?state=batch a group's answers, ?state=waiting the day card with a waiting ask and its Reply button. &card=dictate
     holds the talk keys for two seconds on the open ask and writes the words heard into its note; &reply=closed answers the
     reply with the server's 409 (closed meanwhile), &reply=error with a 503; &old drops `followUps`, as an older server
     does, so the plain notification cards show.
     Asking your assistant in Messages (owner decision, 8 October 2026: phase 5): ?state=mention is Ben's card when Olu
     mentions him in #design (his own Brenda's face, the message in a quoted bubble); the others are Olu's, whose
     assistant is Max (unless ?look=/?name= say otherwise): ?state=mention-reply (Max replied in #design),
     ?state=mention-confirm (something waits for her Confirm in the conversation), ?state=mention-private (an answer only
     she can see; &note shows the "couldn't answer" note instead). OK marks it read; Open logs the conversation's link. -->

  // Her replies are light Markdown (owner request, 7 October 2026): the answer first, then lists with the key words in bold.

};
const saved = [];
window.__TAURI__ = {
  core: { invoke: async (cmd, args = {}) => {

    }

    if (cmd === "get_config") return state === "link" ? { baseUrl: "https://boredroom.cc", signedIn: false } : { baseUrl: "https://boredroom.cc", signedIn: true, workspaceSlug: "company-a", workspaceName: "Company A", displayName: "Ada Employee" };

<script>
// Preview only: feed the cursor the way Rust does, in stage coordinates, and open the card named by ?card=.
addEventListener("mousemove", (e) => window.__h?.["brenda://cursor"]?.({ payload: { x: e.clientX, y: e.clientY } }));
const voiceEvent = (payload) => window.__h?.["brenda://voice"]?.({ payload });
// A speech-like level, as Rust sends it while the keys are held: syllables, short pauses, a little room noise.
let said = 0;
const speech = () => { said += 0.07; const syllable = Math.max(0, Math.sin(said * 9) * Math.sin(said * 2.3 + 1)); const talking = Math.sin(said * 0.7) > -0.55 ? 1 : 0.08; return Math.min(1, 0.03 + syllable * 0.8 * talking + Math.random() * 0.06); };
// Her voice: what Rust sends while she reads a reply aloud (see the comment at the top). The level here only looks like
// speech (syllables in words, short gaps); the real one is measured from what `say` rendered.
const speakingFeed = (() => {
  let live = false, every = null, end = null, pending = null, t = 0;
  const level = () => { t += 0.03; const syllable = Math.max(0, Math.sin(t * 31) * Math.sin(t * 5.3 + 1)); return Math.sin(t * 2.1) > -0.6 ? Math.min(1, syllable * 1.15) : 0; };
  function stop(interrupted) {
    clearTimeout(pending); clearInterval(every); clearTimeout(end);
    pending = every = end = null;
    if (live) { live = false; voiceEvent(interrupted ? { phase: "spoken", interrupted: true } : { phase: "spoken" }); }
  }
  function speakFor(ms, synthetic) {
    stop(true);
    live = true;
    if (synthetic) voiceEvent({ phase: "speaking", synthetic: true });
    else { voiceEvent({ phase: "speaking", level: 0 }); every = setInterval(() => voiceEvent({ phase: "speaking", level: level() }), 30); }
    end = setTimeout(() => stop(false), ms);
  }
  return {
    speakFor,
    stop: () => stop(true),
    /** The mock `speak`: a moment to render, then about as long as the words take to say. */
    say(text) { stop(true); pending = setTimeout(() => speakFor(Math.min(8000, 600 + String(text ?? "").length * 55), q.has("synthetic")), 700); },
  };
})();
const talkFor = (ms) => { voiceEvent({ phase: "listening", level: 0 }); const every = setInterval(() => voiceEvent({ phase: "listening", level: speech() }), 70); if (ms) setTimeout(() => { clearInterval(every); voiceEvent({ phase: "transcribing" }); }, ms); };
setTimeout(() => {
  const c = q.get("card");
  if (c === "listening") talkFor(0);
  if (c === "working") talkFor(2000);
  if (c === "thinking") openCard({ kind: "voice", phase: "thinking", heard: "What is Ben working on?", sticky: true });
  if (c === "reply") ask("What is Ben working on?", { spoken: false });
  if (c === "speaking") ask("What is Ben working on?", { spoken: false }).then(() => speakingFeed.speakFor(4000, q.has("synthetic")));
  if (c === "confirm") ask("Give Ada the brand deck review for tomorrow at 3", { spoken: false });
  if (c === "offer") ask("Add calling Josh and start my top task", { spoken: false });
  if (c === "error") voiceEvent({ phase: "error", message: "The microphone is blocked. Allow it in System Settings, Privacy, Microphone." });
  if (c === "voice-off") voiceEvent({ phase: "off" });
  // Holding the talk keys on an open ask: the words go into its note, never to her.
  if (c === "dictate") setTimeout(() => { talkFor(2000); setTimeout(() => voiceEvent({ phase: "heard", text: "Images land tomorrow morning, then it's ready for a check." }), 3200); }, 600);
  if (c === "drop") window.__h?.["brenda://drag"]?.({ payload: { phase: "drop", x: 240, y: 20, count: 2, files: [{ index: 0, name: "onboarding-flow-v3.pdf", size: 1843200, problem: null }, { index: 1, name: "notes.docx", size: 20480, problem: "Only PDF, PNG, JPEG, WebP and TXT files." }] } });
}, 400);
// ?card=typing: a question typed letter by letter into the open card's ask box (the timer card opens first for a timer).
if (q.get("card") === "typing") setTimeout(() => {
  if (["timer", "paused"].includes(state) && card?.kind !== "home") openCard({ kind: "home" });
  const a = document.getElementById("ask"), words = "What is Ben working on today?";
  if (!a) return;
  a.focus();
  let i = 0;
  const next = setInterval(() => { a.value = words.slice(0, ++i); a.dispatchEvent(new Event("input", { bubbles: true })); if (i >= words.length) clearInterval(next); }, 140);
}, 1200);
// ?gallery: every look and every mood, drawn with the notch's own face() under the island (preview only); ?gallery=3
// draws it three times as large, to look closely at the small faces.
if (q.has("gallery")) {
  const moods = ["", "blink", "happy", "happy pleased", "sad", "alert", "listen", "think", "gulp", "squash", "dizzy", "love"];
  const looks = LOOK_VISORS.flatMap((visor) => LOOK_EYES.map((eyes) => ({ visor, eyes })));
  const pair = (o) => `<span style="display:flex;gap:6px;align-items:center">${face(o)}${face({ ...o, small: true })}</span>`;
  const grid = (n) => `display:grid;grid-template-columns:96px repeat(${n},64px);gap:12px 8px;align-items:center;justify-items:start`;
  const sheet = document.createElement("section");
  sheet.style.cssText = `position:fixed;inset:440px 0 0;overflow:auto;padding:16px 20px 40px;background:#000;display:grid;gap:24px;align-content:start;zoom:${Math.max(1, Math.min(6, Number(q.get("gallery")) || 1))}`;
  sheet.innerHTML = `<p class="title">Every colour, visor and eyes (28px and small 22px)</p>
    <div style="${grid(looks.length)}"><span></span>${looks.map((l) => `<span class="note">${l.visor}, ${l.eyes}</span>`).join("")}
    ${Object.keys(FACES).map((c) => `<span class="sub">${c}</span>${looks.map((l) => pair({ who: { ...l, colour: c, name: c, face: FACES[c] } })).join("")}`).join("")}</div>
    <p class="title">Every mood and reaction on each visor and eyes (orange; the same rules on every colour)</p>
    <div style="${grid(moods.length)}"><span></span>${moods.map((m) => `<span class="note">${m || "neutral"}</span>`).join("")}
    ${looks.map((l) => `<span class="sub">${l.visor}, ${l.eyes}</span>${moods.map((m) => pair({ mood: m, who: { ...l, colour: "orange", name: "Max", face: FACES.orange } })).join("")}`).join("")}</div>`;
  document.body.append(sheet);
}
// ?typed=: words in the ask box of whatever card is open (the timer card opens first for ?state=timer|paused).
if (q.get("typed")) setTimeout(() => {
  if (["timer", "paused"].includes(state) && card?.kind !== "home") openCard({ kind: "home" });
  const a = document.getElementById("ask");
  if (a) { a.value = q.get("typed"); a.focus(); }
}, 1200);
</script>
</body></html>
