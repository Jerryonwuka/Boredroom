<!doctype html>
<!-- Layout preview of the notch in an ordinary browser, with sample data. Not part of the app.
     ?state=link|compact|briefing|timer|paused|reminder|report|lead|idle picks the data; ?card=listening|working|thinking|reply|confirm|offer|error|drop|voice-off|typing|speaking
     opens one of Brenda's cards on top of it (?confirm=already answers its Confirm as already done; ?card=listening feeds the
     waveform and her listening face a speech-like microphone level every 70 ms, as Rust does; ?card=working listens for
     two seconds, then writes the words out, to see the bars turn into the travelling wave; ?card=typing types a question
     into the ask box letter by letter, to see her eyes read along). ?typed=some words types into the open card's ask box,
     to see Send turn orange and the card's other orange button (Start, Resume) go white. ?card=reply shows a reply drawn from her
     light Markdown (a lead sentence, bold labels, a bulleted and a numbered list, a link); hovering a button plays its icon's move. The backdrop is a flat grey desktop with a menu bar strip, so
     the black island reads as it does on screen.
     Personal assistants (owner decision, 7 October 2026): ?look=orange,band,round&name=Max draws the person's own assistant
     as any colour, visor and eyes, with its name in the labels (Brenda, white, bean, pill when left out); ?ws=teal,screen,square&wsname=Atlas
     does the same for the workspace's, which the end-of-day report's card shows (?state=report). ?gallery adds a sheet
     under the island with every colour, visor and eyes at both sizes, and every mood and reaction on each visor and eyes,
     for checking that every combination reads.
     Her voice (owner decision, 7 October 2026: phase 2): ?card=speaking opens a reply and feeds `brenda://voice` as Rust
     does while she reads it aloud: `speaking` with a speech-like level every 30 ms for 4 seconds, then `spoken`, so her
     faces talk and the card's Listen button turns to Stop; ?card=speaking&synthetic sends the fallback's start instead
     (`synthetic`, no levels: the page makes the syllables). The mock `speak` and `stop_speaking` commands answer the same
     way after a short pause for rendering, so Listen and Stop work on any reply (&synthetic applies to them too).
     ?speak=always|never sets the person's choice (the default, voice, speaks only answers to the talk keys). ?look=… gives
     the glow her colour.
     Follow-ups between assistants (owner decision, 8 October 2026: phase 4): ?state=ask opens the request card (Olu's Max
     asks about "Landing page"; pick a quick reply, type or say a line, Send or Not now), ?state=ask-ws the workspace's
     collection before the team report, ?state=answer the answer card (Ben's Brenda answered), ?state=no-reply an expired
     one, ?state=batch a group's answers, ?state=waiting the day card with a waiting ask and its Reply button. &card=dictate
     holds the talk keys for two seconds on the open ask and writes the words heard into its note; &reply=closed answers the
     reply with the server's 409 (closed meanwhile), &reply=error with a 503; &old drops `followUps`, as an older server
     does, so the plain notification cards show.
     Asking your assistant in Messages (owner decision, 8 October 2026: phase 5): ?state=mention is Ben's card when Olu
     mentions him in #design (his own Brenda's face, the message in a quoted bubble); the others are Olu's, whose
     assistant is Max (unless ?look=/?name= say otherwise): ?state=mention-reply (Max replied in #design),
     ?state=mention-confirm (something waits for her Confirm in the conversation), ?state=mention-private (an answer only
     she can see; &note shows the "couldn't answer" note instead). OK marks it read; Open logs the conversation's link.
     Assistants talk to each other (owner decision, 8 October 2026: phase 6): ?state=item-message is Ben's card when Olu's
     Max passes on a message (&tidied: reworded at Olu's request; &card=reply opens the reply box with a line typed in;
     &card=dictate opens it and holds the talk keys to say the line; &send=already answers the reply with the server's 409,
     &send=error with a 503); ?state=item-request is Ada's card when Olu's Max asks her to accept a change (&kind=status|
     comment|reminder for the other kinds, a to-do by default; &card=decline opens the reason box with a reason typed in;
     Accept answers done, or &accept=failed couldn't be done, &accept=closed the server's 409; ?state=item-request&poll=gone
     cancels it from "the web" two seconds after it opens). Olu's own: ?state=item-done (Ada accepted: to-do added),
     ?state=item-declined (with Ada's reason), ?state=item-reply (Ben replied to her message), ?state=thread-reply (Ben's
     Brenda replied to her tag in #design). Ben's ?state=tagged (Olu asked his Brenda in #design). ?state=waiting-items is
     the day card with a request and a message waiting (?state=waiting adds a follow-up ask before them; two show). &old
     drops `assistantItems` (and `followUps`), as an older server does, so the plain notification cards show.
     Acting without asking (owner decision, 8 October 2026): &mode=auto gives the person's mode as the desktop state carries
     it (`assistant.act`), so the chat card's header shows the amber "Acting without asking" pill (with ?card=reply or any
     question typed); &mode=ask (the default) shows nothing, nor do &mode=workspace (auto, turned off by the workspace),
     &mode=not_ready (before migration 0045) and &mode=old (no `act`: an older server). Olu, whose assistant is Max, in
     auto: ?state=auto-done asks Max to tell Ben the deadline moved and to set a reminder; both are done at once, the
     message "(without asking)", each line with Undo for 10 minutes (&until=20 makes the offers last 20 seconds, to see
     the buttons go). Undo answers with the server's words, or &undo=expired|changed|already|error (409 UNDO_EXPIRED,
     UNDO_CHANGED, ALREADY_UNDONE, and a 503 that keeps the button to try again). ?state=auto-undone presses the first
     Undo a moment after the answer arrives. ?state=still-asking is a Confirm that still asks in auto mode, with its "Still
     asking: …" line (&why=tainted, the default, or earlier|everyone|team|fan_out|builtin). The mock chat logs what it is
     sent: an answer that read other people's words comes back `tainted`, and the next question sends that back.
     Brenda keeps the loops closed (owner decision, 8 October 2026: phase 7a): ?state=opener is the morning opener in place
     of the briefing (counts as a list, three one-tap actions: Answer opens a page, Plan puts its words in the ask box;
     &calm=1 a quiet day, the calm line and the default asks; &na=1 one count that could not be read, "not available");
     ?state=quiet is the person's quiet hours (nothing pops or sounds, the compact bar says "Quiet until 07:00 tomorrow",
     the unread count still shows, and a reply is never read aloud on its own, even with &speak=always; &ends=10 ends them
     10 seconds in, and the opener opens on the next poll once the pointer has moved); ?card=routine opens a routine's card
     (What's still owed: its lead, five lines with Open each, Open and Done; &bundle=1 two routines held over quiet hours,
     sent together; &failed=1 one that was paused); ?state=readback asks for a message to #design and shows its Confirm
     with "Goes to" and "What they get" (&many=1 adds a follow-up to eight people: six lines, then "and 2 more"). &old drops
     `opener`, `quiet` and `routineRuns` too, as an older server does: the briefing, never quiet, the plain cards.
     Notifications, "A plus the grafts" (owner decision, 9 October 2026; desktop/src/notify-cards.js draws them, notify.js and
     main.js decide when). Jeremiah's own assistant is pink Brenda; Ada's is purple Nova (screen, square), Ben's blue Max
     (band, pill), Aba's yellow King Jay (band, round), Olu's teal Brenda (screen, round), Fabro's green Brenda; the
     workspace, Khronocorp, has white Brenda. Every notification carries its `facts` as the server words them
     (src/server/services/notice-facts.ts), and the state lists the cards read. Each state opens after the first poll.
     One card per kind: ?state=n-message (Ada, a direct message), n-mention (Ben, his words with "@Jeremiah" lit), n-reply
     (Brenda answered privately in #design), n-answer (King Jay answered for Aba; &result=on_track|blocked|not_started|
     no_reply|none, not_started by default; none has no result, so the answer's words show), n-batch (a group's counts),
     n-report (the team report's chips, names behind "didn't clock in" and "late"; &source=snapshot only finished, overdue
     and blocked; &none no facts: the plain report), n-approved and n-accepted (Together), n-request (Ben's Max asks to move
     a task; &kind=todo|status|comment|reminder, status by default; &nofacts the old "what would change" lines), n-ask (Olu's
     Brenda wants an update), n-noted (a commitment noted), n-openask (Ada asked the channel), n-blocked (Ben is blocked on
     you), n-standup (the draft to post), n-confirm (a Confirm waiting in #design), n-reminder, n-assigned (Olu gave you a
     task; &due=today|later|overdue, later by default; &nostart: OK instead of Start timer), n-due, n-overdue, n-routine
     (the Friday roundup's counts), n-rollup (Design: 4 of 6 posted), n-clockin, n-plain (a kind the notch doesn't know),
     n-long (a 200-character name and title: nothing overflows, the headline takes its short form; &many three of them, so
     the summary shows them too).
     Several: ?state=n-summary (the mockup's eight: "Hey Jeremiah, you have 8 notifications", seven senders so "+1 more"),
     n-pager&at=0|1|2|7|end (the same eight; the summary's Show them, then Next pressed `at` times; end: past the last, "All
     caught up"), n-burst (a message opens; 5 s later two more arrive: the card says "+2 waiting", folds to "3 new" and
     nothing else opens), n-allread (the summary, then Mark all read: the two asks stay), n-tuck (Ben's request holds 15 s,
     then tucks: "Ben is waiting on you").
     The bar: ?state=n-bar&bar=clear|one|two|many|waiting|timer (or ?n-bar=…): what opened is folded after 1.5 s so the bar
     shows it: nothing ("All clear", only when it is true), one or two (the newest by name and the count), eight ("8 new, 2
     need you" and faces), waiting (Ben's request, after its 15 s hold), timer (the running timer and the count, never "All
     clear").
     Quiet and away: ?state=n-quiet (the eight arrive in quiet hours: nothing opens, the bar says "8 new, 2 need you";
     &ends=10 ends them 10 seconds in and the summary opens), ?state=n-away (the pointer last moved 6 minutes ago: the eight
     wait until the mouse moves over the page).
     Regressions (the empty black island, owner's screenshot, 9 October 2026): ?state=lead&bug=throw (a teammate whose name
     is null; no timer, so the pointer, sent onto the bar 1.5 s in, opens the day card, whose team row used to throw:
     the island stayed open and empty behind "All clear"), ?bug=empty (the mock answers /brenda/desktop 3 s late and the
     pointer reaches the bar at 0.5 s, before any data: it used to open an empty 420px island). After the fix neither shows
     an empty island. -->
<html lang="en"><head><meta charset="utf-8"><title>Brenda notch preview</title><link rel="stylesheet" href="src/style.css">
<style>html,body{background:#3b3b3b!important;height:100%;overflow:hidden!important} body::before{content:"";position:fixed;inset:0 0 auto;height:40px;background:rgb(0 0 0 / .28);box-shadow:inset 0 -1px 0 rgb(255 255 255 / .075)} #stage{position:relative;width:480px;height:440px;margin:0 auto;outline:1px dashed rgb(255 255 255 / .1)}</style></head>
<body><div id="stage"><div id="island" class="island"><i id="wash" class="wash" aria-hidden="true"></i><main id="notch" class="notch compact"></main><i id="countdown" class="countdown"></i></div></div>
<script>
const q = new URLSearchParams(location.search);
const state = q.get("state") || "briefing";
const now = new Date().toISOString();
// ?state=n-bar&bar=timer runs the timer beside the count (9 October 2026); ?bug=throw has none, so the pointer opens the day card.
const timed = (["timer", "paused", "compact", "lead"].includes(state) || ((state === "n-bar" || q.has("n-bar")) && (q.get("bar") ?? q.get("n-bar")) === "timer")) && q.get("bug") !== "throw";
// The person's assistant and the workspace's, as the desktop state carries them: resolved, with the face colours from
// src/lib/assistant-look.ts (PALETTE[colour].face), which the notch cannot import.
const FACES = {
  white: { hi: "#ffffff", mid: "#ececf0", edge: "#c9cad1" }, grey: { hi: "#f2f2f4", mid: "#b9bac2", edge: "#8a8b95" },
  yellow: { hi: "#fff4c2", mid: "#ffd54a", edge: "#d0a015" }, orange: { hi: "#ffdcbd", mid: "#ff9447", edge: "#d0661c" },
  coral: { hi: "#ffddd6", mid: "#ff8676", edge: "#cf5242" }, pink: { hi: "#ffdcec", mid: "#ff8cc0", edge: "#cf528b" },
  purple: { hi: "#e9dfff", mid: "#a88cff", edge: "#7559d6" }, blue: { hi: "#dbe8ff", mid: "#74a3ff", edge: "#416fd4" },
  teal: { hi: "#d1f5f0", mid: "#4ccfc3", edge: "#1f948a" }, green: { hi: "#d5f5e0", mid: "#62d48f", edge: "#2a9960" },
};
const LOOK_VISORS = ["bean", "band", "screen"], LOOK_EYES = ["pill", "round", "square"];
const assistantFrom = (look, name) => {
  const [c, v, e] = String(look ?? "").toLowerCase().split(",").map((x) => x.trim());
  const colour = FACES[c] ? c : "white";
  return { name: name?.trim() || "Brenda", colour, visor: LOOK_VISORS.includes(v) ? v : "bean", eyes: LOOK_EYES.includes(e) ? e : "pill", face: FACES[colour] };
};
// The mention states that are Olu's (phase 5), and what comes back to her from other people's assistants (phase 6), draw
// her assistant, Max, unless the address names another look.
// Acting without asking (8 October 2026): Olu's too.
const autoStates = ["auto-done", "auto-undone", "still-asking"];
// Phase 7a (8 October 2026): the opener, quiet hours, routines and the readback are Olu's too.
const loopStates = ["opener", "quiet", "readback"];
const routineCardShown = q.get("card") === "routine";
const olus = ["mention-reply", "mention-confirm", "mention-private", "item-done", "item-declined", "item-reply", "thread-reply", ...autoStates, ...loopStates].includes(state) || routineCardShown;
const personal = assistantFrom(q.get("look") ?? (olus ? "orange,band,round" : null), q.get("name") ?? (olus ? "Max" : null));
const workspace = assistantFrom(q.get("ws"), q.get("wsname"));
// Follow-ups (phase 4): Olu's assistant Max asks about Ben's "Landing page"; Ben's Brenda answers Ada's follow-up.
const max = assistantFrom("orange,band,round", "Max"), brenda = assistantFrom("white", "Brenda");
const hours = (h) => new Date(Date.now() + h * 3600_000).toISOString();
const ASK = "f1111111-1111-4111-8111-111111111111", ANSWER = "f2222222-2222-4222-8222-222222222222", BATCH = "b3333333-3333-4333-8333-333333333333";
const asks = {
  ask: { id: ASK, title: "Olu's Max wants an update on “Landing page”", question: "Where are you on the landing page? The client asked this morning.", taskTitle: "Landing page", taskHref: "/app/company-a/tasks/66666666-6666-4666-8666-666666666666",
    asker: { name: "Olu Adeyemi", assistant: max }, deadlineAt: hours(4),
    facts: ["“Landing page” is in progress, 60% done, due Fri 9 Oct 17:00", "Latest from you: a comment, Wed 7 Oct 16:02: “Copy is done, waiting on images”", "Time: not shared, Olu can't see your timesheets"] },
  "ask-ws": { id: ASK, title: `${workspace.name} is collecting updates for today's team report`, question: "What did you work on today?", taskTitle: null, taskHref: null, asker: null, deadlineAt: hours(1),
    facts: ["Open: “Landing page” (in progress, 60%), “Brand deck refresh” (blocked)", "Time on it: 3 h 10 min today, 14 h 5 min this week", "Nothing recorded on this lately"] },
};
const answers = {
  answer: { id: ANSWER, title: "Ben's Brenda answered about “Landing page”", status: "answered", subject: { name: "Ben Okafor", assistant: brenda }, answeredAt: now, href: `/app/company-a/home/follow-ups/${ANSWER}`,
    answer: "Ben says it's on track: “Images land tomorrow morning”. “Landing page” is in progress, 60% done, due Fri 9 Oct 17:00. Ben's latest update was a comment on Wed 7 Oct 16:02: “Copy is done, waiting on images”." },
  "no-reply": { id: ANSWER, title: "No reply from Ben about “Landing page”", status: "expired", subject: { name: "Ben Okafor", assistant: brenda }, answeredAt: now, href: `/app/company-a/home/follow-ups/${ANSWER}`,
    answer: "No reply from Ben by 19:41. “Landing page” is in progress, 60% done, due Fri 9 Oct 17:00. Nothing has been recorded on it by Ben lately." },
};
// Mentions in Messages (phase 5): the notifications as the server words them (titles, bodies and links in the contract).
const DESIGN = "c4444444-4444-4444-8444-444444444444", TAGGING = "e5555555-5555-4555-8555-555555555555";
const thread = `/app/company-a/messages?c=${DESIGN}#m-${TAGGING}`;
const mentions = {
  mention: { id: "n6", type: "message.mention", resource_id: DESIGN, title: "Olu Adeyemi mentioned you in #design", body: "@Ben Okafor can you send the hero images before 3? The client wants to see the landing page today.", href: thread, created_at: now },
  "mention-reply": { id: "n5", type: "brenda.mention_reply", resource_id: DESIGN, title: "Max replied in #design", body: "“Landing page” is in progress, 60% done, due Fri 9 Oct 17:00.\n- Copy is done\n- Ben is waiting on the hero images\nBen's last update was a comment on Wed 7 Oct 16:02.", href: thread, created_at: now },
  "mention-confirm": { id: "n4", type: "brenda.mention_confirm", resource_id: DESIGN, title: "Max needs you to confirm in #design", body: "Remind you Thu 8 Oct, 15:00: Call Ben about the hero images", href: thread, created_at: now },
  "mention-private": q.has("note")
    ? { id: "n3", type: "brenda.mention_private", resource_id: DESIGN, title: "Max couldn't answer in #design", body: "Assistants can't reply in this conversation. Ask Max in your own chat instead.", href: thread, created_at: now }
    : { id: "n3", type: "brenda.mention_private", resource_id: DESIGN, title: "Max answered you in #design", body: "Only visible to you. Ben clocked in at 09:12 and has 3h 10m on “Landing page” today.\n- Chidi is on leave\n- Everyone else in Design is in", href: thread, created_at: now },
};
// Assistants talk to each other (phase 6): what DesktopAssistantItems carries (src/server/services/desktop.ts), worded as
// the server words it. Olu's Max passes Ben a message and asks Ada to accept a change; Ada's Brenda and Ben's Brenda bring
// Olu what came of hers.
const MSG = "a7777777-7777-4777-8777-777777777777", REQ = "a8888888-8888-4888-8888-888888888888", REPLY = "a9999999-9999-4999-8999-999999999999";
const item = (id) => `/app/company-a/home/assistants/items/${id}`;
const friday = new Date(Date.now() + 2 * 86_400_000); friday.setHours(17, 0, 0, 0);
const kinds = {
  todo: { lines: ["Add to your to-dos: “Review pricing”", "Due: Fri 9 Oct, 17:00"], summary: "add the to-do “Review pricing”, due Fri 9 Oct, 17:00",
    payload: { v: 1, kind: "add_todo", title: "Review pricing", dueAt: friday.toISOString() }, words: "Added “Review pricing” to your to-dos" },
  status: { lines: ["Task: “Landing page”", "Move it from In progress to In review", "Note for the reviewer: “The client approved the copy.”"], summary: "move “Landing page” to In review",
    payload: { v: 1, kind: "task_status", taskId: "66666666-6666-4666-8666-666666666666", taskTitle: "Landing page", from: "in_progress", to: "in_review", reason: "The client approved the copy." }, words: "Sent “Landing page” for review" },
  comment: { lines: ["Task: “Landing page”", "Comment as you: “The client approved the copy.”"], summary: "comment on “Landing page”",
    payload: { v: 1, kind: "task_comment", taskId: "66666666-6666-4666-8666-666666666666", taskTitle: "Landing page", text: "The client approved the copy." }, words: "Commented on “Landing page”" },
  reminder: { lines: ["Remind you: “Call Josh about the invoice”", "When: Thu 8 Oct, 15:00"], summary: "remind you at Thu 8 Oct, 15:00 to call Josh about the invoice",
    payload: { v: 1, kind: "set_reminder", text: "Call Josh about the invoice", at: hours(3) }, words: "Reminder set for Thu 8 Oct, 15:00" },
};
const req = kinds[q.get("kind")] ?? kinds.todo;
const olu = { name: "Olu Adeyemi", assistant: max };
const itemsWaiting = {
  message: { id: MSG, kind: "message", title: "Olu's Max passed on a message", body: "The client moved the deadline to Friday. Can you check the hero images still fit the new copy?", lines: [], note: null,
    sender: olu, createdAt: now, expiresAt: null, canReply: true, tidied: q.has("tidied"), href: item(MSG) },
  request: { id: REQ, kind: "request", title: `Olu's Max asks you to accept: ${req.summary}`, body: null, lines: req.lines, note: "The client wants this before Friday's call.",
    sender: olu, createdAt: now, expiresAt: hours(72), canReply: false, tidied: false, href: item(REQ) },
};
const itemsUpdates = {
  "item-done": { id: REQ, kind: "request", title: "Ada accepted: to-do added", body: "Add the to-do “Review pricing”, due Fri 9 Oct, 17:00", status: "done", other: { name: "Ada Obi", assistant: brenda }, at: now, href: item(REQ) },
  "item-declined": { id: REQ, kind: "request", title: "Ada declined your request", body: "We already reviewed pricing on Monday, so I'll leave it.", status: "declined", other: { name: "Ada Obi", assistant: brenda }, at: now, href: item(REQ) },
  "item-reply": { id: REPLY, kind: "reply", title: "Ben replied to your message", body: "Thanks, they still fit. I'll send the final set on Thursday.", status: "delivered", other: { name: "Ben Okafor", assistant: brenda }, at: now, href: item(REPLY) },
};
const itemWaitingFor = state === "item-message" ? [itemsWaiting.message] : state === "item-request" ? [itemsWaiting.request] : ["waiting", "waiting-items"].includes(state) ? [itemsWaiting.request, itemsWaiting.message] : [];
const itemsState = q.has("old") ? undefined : { ready: true, waiting: itemWaitingFor, updates: itemsUpdates[state] ? [itemsUpdates[state]] : [] };
const itemNotes = {
  "item-message": { id: "n11", type: "assistant.message", resource_id: MSG, title: "Olu's Max passed on a message", body: `“${itemsWaiting.message.body.slice(0, 119)}…”`, href: item(MSG), created_at: now },
  "item-request": { id: "n12", type: "assistant.request", resource_id: REQ, title: `Olu's Max asks you to accept: ${req.summary}`, body: "Nothing changes until you accept. It expires Sun 11 Oct, 14:00.", href: item(REQ), created_at: now },
  "item-done": { id: "n13", type: "assistant.outcome", resource_id: REQ, title: "Ada accepted: to-do added", body: "Add the to-do “Review pricing”, due Fri 9 Oct, 17:00", href: item(REQ), created_at: now },
  "item-declined": { id: "n14", type: "assistant.outcome", resource_id: REQ, title: "Ada declined your request", body: "“We already reviewed pricing on Monday, so I'll leave it.”", href: item(REQ), created_at: now },
  "item-reply": { id: "n15", type: "assistant.reply", resource_id: REPLY, title: "Ben replied to your message", body: "“Thanks, they still fit. I'll send the final set on Thursday.”", href: item(REPLY), created_at: now },
  tagged: { id: "n16", type: "assistant.tagged", resource_id: DESIGN, title: "Olu asked your Brenda in #design", body: "“Landing page” is in progress, 60% done, due Fri 9 Oct 17:00. Ben's last update was a comment on Wed 7 Oct 16:02.", href: thread, created_at: now },
  "thread-reply": { id: "n17", type: "assistant.thread_reply", resource_id: DESIGN, title: "Ben's Brenda replied in #design", body: "I've asked Ben. I'll reply here by 16:30.", href: thread, created_at: now },
};
// Acting without asking (8 October 2026): the person's mode as the desktop state and each chat answer carry it (ActState,
// src/lib/act-mode.ts, which the notch cannot import). The auto states are Olu in "Act without asking".
const ACT = {
  ask: { ready: true, mode: "ask", allowed: true, effective: "ask", locked: null },
  auto: { ready: true, mode: "auto", allowed: true, effective: "auto", locked: null },
  workspace: { ready: true, mode: "auto", allowed: false, effective: "ask", locked: "workspace" },
  not_ready: { ready: false, mode: "ask", allowed: true, effective: "ask", locked: "not_ready" },
};
const act = ACT[q.get("mode") ?? (autoStates.includes(state) ? "auto" : "ask")] ?? null; // &mode=old: none, as an older server
const undoFor = Number(q.get("until")) > 0 ? Number(q.get("until")) * 1000 : 10 * 60_000;
const offer = (token) => ({ token, until: new Date(Date.now() + undoFor).toISOString() });
// What each Undo did, in the server's words (src/server/services/undo.ts).
const UNDONE = { "preview-undo-message": "Withdrew the message. They may have seen it already.", "preview-undo-reminder": "Cancelled the reminder" };
const WHY = {
  tainted: ["Send Ada Obi a message", "Still asking: Max read other people's words in this reply."],
  earlier: ["Send Ada Obi a message", "Still asking: other people's messages are earlier in this chat. Start a new chat for Max to act without asking."],
  everyone: ["Send a message to #general, everyone in the workspace", "Still asking: this goes to everyone in the workspace."],
  team: ["Send a message to #design, the Design team's channel", "Still asking: this goes to a whole team."],
  fan_out: ["Ask 5 people in Design for an update on “Landing page”", "Still asking: this reaches more than 3 people at once."],

  if (c === "dictate" && !itemCardState) setTimeout(() => { talkFor(2000); setTimeout(() => voiceEvent({ phase: "heard", text: "Images land tomorrow morning, then it's ready for a check." }), 3200); }, 600);
  // Acting without asking (8 October 2026): Olu asks Max; ?state=auto-undone then presses the first Undo.
  if (autoStates.includes(state)) {
    ask(state === "still-asking" ? "Catch me up on #design and tell Ada the review moved" : "Tell Ben the client moved the deadline to Friday, and remind me at 4 to check the hero images still fit", { spoken: false })
      .then(() => { if (state === "auto-undone") setTimeout(() => undoDone("preview-undo-message"), 900); });
  }
  // The Confirm readback (phase 7a): Olu asks Max to tell #design the review moved.
  if (state === "readback") ask("Tell #design the review moved to Thursday", { spoken: false });
  if (c === "drop") window.__h?.["brenda://drag"]?.({ payload: { phase: "drop", x: 240, y: 20, count: 2, files: [{ index: 0, name: "onboarding-flow-v3.pdf", size: 1843200, problem: null }, { index: 1, name: "notes.docx", size: 20480, problem: "Only PDF, PNG, JPEG, WebP and TXT files." }] } });
}, 400);
// ?card=typing: a question typed letter by letter into the open card's ask box (the timer card opens first for a timer).
if (q.get("card") === "typing") setTimeout(() => {
  if (["timer", "paused"].includes(state) && card?.kind !== "home") openCard({ kind: "home" });
  const a = document.getElementById("ask"), words = "What is Ben working on today?";
  if (!a) return;
  a.focus();
  let i = 0;
  const next = setInterval(() => { a.value = words.slice(0, ++i); a.dispatchEvent(new Event("input", { bubbles: true })); if (i >= words.length) clearInterval(next); }, 140);
}, 1200);
// ?gallery: every look and every mood, drawn with the notch's own face() under the island (preview only); ?gallery=3
// draws it three times as large, to look closely at the small faces.
if (q.has("gallery")) {
  const moods = ["", "blink", "happy", "happy pleased", "sad", "alert", "listen", "think", "gulp", "squash", "dizzy", "love"];
  const looks = LOOK_VISORS.flatMap((visor) => LOOK_EYES.map((eyes) => ({ visor, eyes })));
  const pair = (o) => `<span style="display:flex;gap:6px;align-items:center">${face(o)}${face({ ...o, small: true })}</span>`;
  const grid = (n) => `display:grid;grid-template-columns:96px repeat(${n},64px);gap:12px 8px;align-items:center;justify-items:start`;
  const sheet = document.createElement("section");
  sheet.style.cssText = `position:fixed;inset:440px 0 0;overflow:auto;padding:16px 20px 40px;background:#000;display:grid;gap:24px;align-content:start;zoom:${Math.max(1, Math.min(6, Number(q.get("gallery")) || 1))}`;
  sheet.innerHTML = `<p class="title">Every colour, visor and eyes (28px and small 22px)</p>
    <div style="${grid(looks.length)}"><span></span>${looks.map((l) => `<span class="note">${l.visor}, ${l.eyes}</span>`).join("")}
    ${Object.keys(FACES).map((c) => `<span class="sub">${c}</span>${looks.map((l) => pair({ who: { ...l, colour: c, name: c, face: FACES[c] } })).join("")}`).join("")}</div>
    <p class="title">Every mood and reaction on each visor and eyes (orange; the same rules on every colour)</p>
    <div style="${grid(moods.length)}"><span></span>${moods.map((m) => `<span class="note">${m || "neutral"}</span>`).join("")}
    ${looks.map((l) => `<span class="sub">${l.visor}, ${l.eyes}</span>${moods.map((m) => pair({ mood: m, who: { ...l, colour: "orange", name: "Max", face: FACES.orange } })).join("")}`).join("")}</div>`;
  document.body.append(sheet);
}
// Notifications, "A plus the grafts" (owner decision, 9 October 2026): what each n- state does after the first poll, through
// the buttons the cards carry (their data-act), as a person would press them.
const pressNotch = (sel) => { const b = document.querySelector(`#notch ${sel}`); if (b && !b.disabled) { b.click(); return true; } return false; };
/** The pointer onto the compact bar, as Rust reports it. */
const pointAtBar = () => { const r = document.getElementById("island").getBoundingClientRect(); window.__h?.["brenda://cursor"]?.({ payload: { x: r.left + r.width / 2, y: r.top + Math.min(12, r.height / 2) } }); };
if (state === "n-away") lastMoveAt = Date.now() - 6 * 60_000; // the pointer last moved 6 minutes ago
if (state === "n-burst") setTimeout(() => {
  // Two more arrive while the message is open: they join the bar ("+2 waiting"); nothing else opens.
  // Written now, as a real arrival is (the notch only counts as arrived what is newer than what it has seen; review, 9 October 2026).
  sample.notifications = [...nPick([["mention"], ["approved"]]).map((n) => ({ ...n, created_at: new Date().toISOString() })), ...sample.notifications];
  refresh().then(() => arrive());
}, 5000);
if (state === "n-pager") setTimeout(() => {
  pressNotch('[data-act="pg-show"]');
  const at = q.get("at") === "end" ? EIGHT.length : Math.max(0, Math.min(EIGHT.length - 1, Number(q.get("at")) || 0));
  let n = 0;
  const step = () => { if (n++ >= at) return; pressNotch('[data-act="pg-next"]'); setTimeout(step, 400); };
  setTimeout(step, 400);
}, 1500);
if (state === "n-allread") setTimeout(() => pressNotch('[data-act="pg-all"]'), 1500);
// The bar states: what opened folds, so the bar shows what is unread (the waiting state tucks on its own after 15 s).
if (nState === "n-bar" && ["one", "two", "many", "timer"].includes(barKind)) setTimeout(() => closeCard(), 1500);
if (bug === "throw") setTimeout(pointAtBar, 1500);
if (bug === "empty") setTimeout(pointAtBar, 500);
// ?typed=: words in the ask box of whatever card is open (the timer card opens first for ?state=timer|paused).
if (q.get("typed")) setTimeout(() => {
  if (["timer", "paused"].includes(state) && card?.kind !== "home") openCard({ kind: "home" });
  const a = document.getElementById("ask");
  if (a) { a.value = q.get("typed"); a.focus(); }
}, 1200);
</script>
