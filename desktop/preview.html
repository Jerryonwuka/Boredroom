    if (taskState === "accessibility") setTimeout(() => { pressNotch('[data-act="help-turn-on"]'); setTimeout(() => pressNotch('[data-act="help-go"]'), 1200); }, 900);
    return;
  }
  if (taskState === "consent-files" || taskState === "finder") {
    window.__h?.["brenda://act-consent"]?.({ payload: { which: "files" } });
    if (taskState === "finder") setTimeout(() => pressNotch('[data-act="help-turn-on"]'), 900);
    return;
  }
  if (taskState === "refused") return actEvent({ phase: "refused", reason: reason ?? "use_mac_off", app: reason === "forbidden_app" ? "1Password" : "Figma", n: 20, pages: 212, message: reason === "file_failed" ? "Word couldn't be made from that." : reason === "ACT_LIMIT" ? "You've used today's 150 requests to Brenda, so Brenda can't carry on. Try again tomorrow." : "" });
  if (taskState === "confirm-voice") {
    lookHoldV2({ heard: "Remind me to export this as a PDF tomorrow" });
    return whenCard("voice", "reply", () => setTimeout(() => {
      voiceEvent({ phase: "listening", level: 0, answer: true, forConfirm: "preview-look-tok" });
      setTimeout(() => { voiceEvent({ phase: "transcribing", answer: true, forConfirm: "preview-look-tok" }); setTimeout(() => actEvent({ phase: "heard", forConfirm: "preview-look-tok", text: "Yes please", verdict: "yes" }), 700); }, 1200);
    }, 1500));
  }
  // A request said with her keys, then the proposal; then the answer this state shows.
  const kind = fileTask ? "file" : "screen";
  lookHoldV2({ heard: q.get("heard") ?? (q.get("risky") === "1" && kind === "screen" ? "Reply to Ada that the deck is ready and send it" : REQUEST[kind]) });
  const answer = q.get("answer") ?? (taskState === "asking" ? null : "button");
  whenCard("act", "asking", () => setTimeout(() => {
    if (answer === "button") pressNotch('[data-act="act-yes"]');
    if (answer === "voice-yes") sayAnswer("Yes, I need you to do this", "yes");
    if (answer === "voice-no") sayAnswer("No", "no");
    if (answer === "voice-unclear") sayAnswer("Maybe later", "unclear");
    if (answer === "new-request") sayAnswer("No, only rename the first three", "no");
    if (answer === "typed-yes") { const a = document.getElementById("aans"); if (a) { a.focus(); a.value = "yes please"; a.form?.requestSubmit(); } }
  }, 1500));
  // The pointer rests on the doing or working bar: its card opens.
  if (taskState === "doing" || taskState === "working") setTimeout(pointAtBar, 9000);
}
/** The helpers states' runs (helpers contract Q.4; see the comment at the top). */
function phase4Run() {
  const hold = (heard) => lookHoldV2({ heard });
  // The pointer rests on the strip: a Files job's card opens (F.1).
  const openJob = (ms) => setTimeout(pointAtBar, ms);
  if (state === "front-done" && q.get("open") === "1") setTimeout(() => pressNotch('[data-act="front-others"]'), 6000);
  if (state === "front-doing" || state === "front-done") return hold(q.get("undo") === "1" ? "Take a screenshot of this" : q.get("others") === "2" ? "Find last week's invoice and open it" : p4Cmd?.heard ?? "Open Figma");
  if (state === "front-routing") return hold("Remind me at 3 to call Ada");
  if (state === "front-ask") return hold({ trash: "Empty the Trash", wifi: "Turn off Wi-Fi", check: "Open Figma" }[q.get("what") ?? "trash"] ?? "Empty the Trash");
  if (state === "front-choose") return hold("Open the Q3 deck");
  if (state === "front-found") return hold("Find my invoices");
  if (state === "front-refused") {
    const w = q.get("why") ?? "app_none";
    return hold({ app_none: "Open Figmaa", not_open: "Quit Spotify", installer: "Open Install macOS", accessibility: "Minimise Figma", screen: "Take a screenshot", secure: "Type my password here", nothing_selected: "Copy that", no_box: "Write running late here", finder_denied: "Empty the Trash", wifi_admin: "Turn off Wi-Fi", offline: "Organise my desktop", no_credit: "Organise my desktop", busy: "Organise my desktop" }[w] ?? "Open Figmaa");
  }
  if (state === "job-running") { hold("Organise my desktop"); if (!q.has("bar")) openJob(4500); return; }
  if (state === "job-paused") { hold("Organise my desktop"); if (!q.has("bar")) openJob(5500); return; }
  if (state === "job-ask" || state === "job-done" || state === "job-failed") return hold(state === "job-ask" ? "Delete my old screenshots" : "Organise my desktop");
  if (state === "job-stopped") { hold("Organise my desktop"); openJob(4500); return whenCard("job", "running", () => setTimeout(() => pressNotch('[data-act="job-stop"]'), 1200)); }
  if (state === "job-undone") { hold("Organise my desktop"); return whenCard("job", "done", () => setTimeout(() => pressNotch('[data-act="job-undo"]'), 1200)); }
  if (state === "jobs-recent") return binary >= 4 ? openRecentJobs() : window.__h?.["brenda://look-settings"]?.({ payload: null });
  if (state === "job-replay") return hold("Organise my desktop");
  if (state === "consent-click" || state === "operator-doing" || state === "operator-paused-own") {
    hold("Fill in this form");
    if (state !== "consent-click") { whenCard("front", "consent", () => setTimeout(() => pressNotch('[data-act="consent-yes"]'), 900)); setTimeout(pointAtBar, 6500); }
    // &carry=1: the own-window pause's Carry on is pressed, and the steps go on (helpers contract L.1, I.5).
    if (state === "operator-paused-own" && q.get("carry") === "1") setTimeout(() => whenCard("act", "paused", () => setTimeout(() => pressNotch('[data-act="act-continue"]'), 1200)), 7000);
    return;
  }
  if (state === "settings-v4") {
    window.__h?.["brenda://look-settings"]?.({ payload: null });
    // &scroll=end scrolls the switches to the new rows (the list scrolls inside the card).
    if (q.get("scroll") === "end") setTimeout(() => { const l = document.querySelector(".sw-list"); if (l) l.scrollTop = l.scrollHeight; }, 600);
    if (q.has("press")) setTimeout(() => pressNotch('[data-key="check-every"]'), 900);
    return;
  }
  if (state === "look-think") return hold("What does this error mean?");
  if (state === "reply-quick") return hold("Remind me at 3 to call Ada");
  if (state === "reply-confirm") return hold("Message Ada that I'm done");
}
if (lookState) setTimeout(() => {
  if (p4) return phase4Run();
  if (p3) return phase3Run();
  if (taskState || V2_LOOKS.includes(lookState)) return phase2Run();
  const reason = q.get("reason");
  if (lookState === "consent") return window.__h?.["brenda://look-consent"]?.({ payload: null });
  if (lookState === "permission") { lookPressed(); if (q.get("permission") === "denied" && q.get("asked") !== "1") setTimeout(() => pressNotch('[data-act="look-continue"]'), 900); return; }
  // The setup card's Turn this on (phase 3: the tray's "Turn on screen help…" opens the setup card).
  if (lookState === "on") { window.__h?.["brenda://look-consent"]?.({ payload: null }); return setTimeout(() => pressNotch('[data-act="help-turn-on"]'), 900); }
  if (lookState === "holding") return lookHold({ release: false });
  if (lookState === "preview" || lookState === "call") return lookPreviewState();
  if (lookState === "sending" || lookState === "reply") { lookHold(); return whenLookReady(() => pressNotch('[data-act="look-send"]')); }
  if (lookState === "timeout") { const id = lookHold(); return setTimeout(() => lookEvent({ phase: "cancelled", lookId: id, reason: "timeout" }), 4000); }
  if (lookState === "off") { if (q.get("from") === "tray") setTimeout(() => { lookMac.on = false; window.__h?.["brenda://look-status"]?.({ payload: lookStatusNow() }); }, 600); return; }
  if (lookState === "point") return ask("How do I start a task for someone?", { spoken: false }).then(() => { if (q.has("press")) setTimeout(() => pressNotch('[data-act="look-show"]'), 1200); });
  if (lookState === "refused") {
    if (reason === "send") { lookHold(); return whenLookReady(() => pressNotch('[data-act="look-send"]')); }
    if (reason === "error") return lookEvent({ phase: "error", message: q.get("message") ?? "That window is too big to send." });
    const src = q.get("source") ?? "fixed";
    const app = reason === "never_look" ? (src === "workspace" ? "Notion" : src === "you" ? "Mail" : "1Password") : "Figma";
    return lookEvent({ phase: "refused", reason: reason ?? "no_window", app: { name: app }, ...(reason === "never_look" ? { source: src } : {}) });
  }
}, 900);
// ?typed=: words in the ask box of whatever card is open (the timer card opens first for ?state=timer|paused).
if (q.get("typed")) setTimeout(() => {
  if (["timer", "paused"].includes(state) && card?.kind !== "home") openCard({ kind: "home" });
  const a = document.getElementById("ask");
  if (a) { a.value = q.get("typed"); a.focus(); }
}, 1200);
</script>
