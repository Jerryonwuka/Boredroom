<html lang="en"><head><meta charset="utf-8"><title>Brenda</title><link rel="stylesheet" href="face.css"><link rel="stylesheet" href="companion.css"></head>

  </div>
  <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="pill"><p class="l1"></p><p class="l2"></p><p class="l3"></p></div>
</div><script src="companion.js"></script></body></html>
